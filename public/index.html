<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>할 일</h1>
      <div id="user-box" class="user-box" hidden>
        <span id="user-email"></span>
        <button id="logout" type="button">로그아웃</button>
      </div>
    </header>

    <section id="auth-view" class="auth" hidden>
      <form id="auth-form" class="auth-form">
        <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
        <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
        <div class="auth-buttons">
          <button type="submit" data-mode="login" class="primary">로그인</button>
          <button type="submit" data-mode="signup">회원가입</button>
        </div>
      </form>
      <p id="auth-message" class="info" hidden></p>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>

    <section id="todo-view" hidden>
    <form id="add-form" class="add-form" autocomplete="off">
      <input id="title" name="title" placeholder="할 일을 입력하세요" maxlength="200" required>
      <div class="add-row">
        <label>마감일 <input id="due" name="due" type="date"></label>
        <input id="tags" name="tags" placeholder="태그 (쉼표로 구분: 공부, 집)">
        <button type="submit">추가</button>
      </div>
      <textarea id="memo" name="memo" rows="2" placeholder="메모 (선택)"></textarea>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <nav class="filters" id="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="active">미완료</button>
      <button data-filter="today">오늘 할 일</button>
      <button data-filter="overdue">마감 지남</button>
      <button data-filter="done">완료</button>
    </nav>

    <div class="toolbar">
      <input id="search" type="search" placeholder="검색 (할 일·메모)">
    </div>
    <div id="tag-filter" class="tag-filter"></div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>표시할 할 일이 없습니다.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
